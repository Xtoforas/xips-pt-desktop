name: build-desktop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform set to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing is packaged or published unless the renderer typechecks, tests pass and it builds.
  # No Tauri Linux packages here: the web checks don't need them.
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build renderer
        run: npm run build

  select-platforms:
    name: Select platforms
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: set-matrix
        env:
          REQUESTED_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platform || 'all' }}
        run: |
          case "$REQUESTED_PLATFORM" in
            windows)
              MATRIX='{"include":[{"platform":"windows","label":"Windows","os":"windows-latest","bundles":"nsis,msi","artifact_paths":"apps/desktop/src-tauri/target/release/bundle/nsis/**\napps/desktop/src-tauri/target/release/bundle/msi/**"}]}'
              ;;
            macos)
              MATRIX='{"include":[{"platform":"macos","label":"macOS","os":"macos-latest","bundles":"app,dmg","artifact_paths":"apps/desktop/src-tauri/target/release/bundle/macos/**\napps/desktop/src-tauri/target/release/bundle/dmg/**"}]}'
              ;;
            linux)
              MATRIX='{"include":[{"platform":"linux","label":"Linux","os":"ubuntu-24.04","bundles":"appimage,deb,rpm","artifact_paths":"apps/desktop/src-tauri/target/release/bundle/appimage/**\napps/desktop/src-tauri/target/release/bundle/deb/**\napps/desktop/src-tauri/target/release/bundle/rpm/**"}]}'
              ;;
            *)
              MATRIX='{"include":[{"platform":"windows","label":"Windows","os":"windows-latest","bundles":"nsis,msi","artifact_paths":"apps/desktop/src-tauri/target/release/bundle/nsis/**\napps/desktop/src-tauri/target/release/bundle/msi/**"},{"platform":"macos","label":"macOS","os":"macos-latest","bundles":"app,dmg","artifact_paths":"apps/desktop/src-tauri/target/release/bundle/macos/**\napps/desktop/src-tauri/target/release/bundle/dmg/**"},{"platform":"linux","label":"Linux","os":"ubuntu-24.04","bundles":"appimage,deb,rpm","artifact_paths":"apps/desktop/src-tauri/target/release/bundle/appimage/**\napps/desktop/src-tauri/target/release/bundle/deb/**\napps/desktop/src-tauri/target/release/bundle/rpm/**"}]}'
              ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  package:
    needs: [verify, select-platforms]
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-platforms.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build desktop bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/desktop
        env:
          # linuxdeploy ships as an AppImage and needs FUSE to mount itself; GitHub's
          # ubuntu-24.04 runners don't have FUSE, so make it self-extract instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Build signed desktop bundles
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xips-pt-desktop-${{ matrix.platform }}-${{ github.ref_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [verify, package]
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Collect release assets and build updater manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import datetime
          import json
          import os
          import pathlib
          import shutil
          import sys
          import urllib.parse

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          version = tag.removeprefix("v")

          assets = pathlib.Path("assets")
          assets.mkdir(exist_ok=True)

          suffixes = (".exe", ".msi", ".dmg", ".AppImage", ".deb", ".rpm", ".app.tar.gz", ".sig")
          released = {}
          for path in pathlib.Path("bundles").rglob("*"):
              if not path.is_file() or not path.name.endswith(suffixes):
                  continue
              if ".app/" in path.as_posix():
                  continue
              # GitHub rewrites spaces in asset names; rename up front so
              # latest.json URLs match the uploaded assets exactly.
              name = path.name.replace(" ", ".")
              if name in released:
                  sys.exit(f"duplicate release asset name: {name}")
              shutil.copy2(path, assets / name)
              released[name] = assets / name

          def entry(name):
              signature = released.get(f"{name}.sig")
              if signature is None:
                  sys.exit(f"missing updater signature for {name}")
              return {
                  "signature": signature.read_text().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(name)}",
              }

          def first(suffix):
              matches = sorted(name for name in released if name.endswith(suffix))
              return matches[0] if matches else None

          platforms = {}
          if name := first("-setup.exe"):
              platforms["windows-x86_64"] = entry(name)
          if name := first(".AppImage"):
              platforms["linux-x86_64"] = entry(name)
          if name := first(".app.tar.gz"):
              # macos-latest runners are Apple Silicon.
              platforms["darwin-aarch64"] = entry(name)

          if "windows-x86_64" not in platforms:
              sys.exit("no signed Windows NSIS bundle found; refusing to publish release")

          manifest = {
              "version": version,
              "notes": f"xips-pt desktop {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          (assets / "latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber assets/*
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes assets/*
          fi
